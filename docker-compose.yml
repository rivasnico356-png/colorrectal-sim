services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - datos_pg:/var/lib/postgresql/data
    ports:
      # Solo desde el propio equipo (pgAdmin o desarrollo sin Docker); el backend usa la red interna (db:5432).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      ESQUEMA_DIR: /app/db
      ESTUDIOS_DIR: /app/estudios
    volumes:
      - ./data/media:/app/media
      - ./db:/app/db:ro
      - ./backend/modelos:/app/modelos:ro
      # RF-010 y RNF-003: estudios propios cifrados; el volumen sobrevive a recrear el contenedor y solo lo monta el backend.
      - estudios_cifrados:/app/estudios
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  datos_pg:
  estudios_cifrados:
