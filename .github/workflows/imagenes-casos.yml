# Extrae de HyperKvasir (Borgli et al., 2020; CC BY 4.0) fotos distintas para cada etapa de los casos clínicos y las
# deja como candidatas en backend/app/demo/candidatas/, con su carpeta de origen. Los pólipos salen de la partición de
# PRUEBA del modelo de visión (imágenes que el modelo no vio al entrenar), sin repetir la imagen del caso de demostración.
name: Extraer imágenes de HyperKvasir para los casos

on:
  workflow_dispatch:
  push:
    branches: [feature/imagenes-distintas]
    paths: [.github/workflows/imagenes-casos.yml]

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar HyperKvasir (imágenes segmentadas de pólipos)
        run: |
          mkdir -p data && cd data
          aia=$(echo | openssl s_client -connect datasets.simula.no:443 -servername datasets.simula.no 2>/dev/null \
                | openssl x509 -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:[^ ]*' | sed 's/CA Issuers - URI://')
          curl -fsSL "$aia" -o intermedio.crt
          (openssl x509 -inform DER -in intermedio.crt 2>/dev/null || openssl x509 -in intermedio.crt) > intermedio.pem
          cat /etc/ssl/certs/ca-certificates.crt intermedio.pem > cadena.pem
          curl -fsSL --retry 3 --cacert cadena.pem -o seg.zip https://datasets.simula.no/downloads/hyper-kvasir/hyper-kvasir-segmented-images.zip
          ls -lh seg.zip && unzip -qo seg.zip
          find . -maxdepth 3 -type d | head
      - name: Elegir pólipos de la partición de prueba
        run: |
          gh release download modelo-vision -p particiones.json -D salidas
          python3 - <<'PY'
          import json, os, glob, shutil
          prueba = [os.path.basename(p) for p in json.load(open('salidas/particiones.json'))['prueba']]
          imgs = [d for d in glob.glob('data/**/images', recursive=True) if os.path.isdir(d)][0]
          presentes = set(os.listdir(imgs))
          print('Pólipos de prueba presentes en las imágenes segmentadas de HyperKvasir:', len([n for n in prueba if n in presentes]))
          destino = 'backend/app/demo/candidatas'
          man = json.load(open(f'{destino}/manifiesto.json'))
          elegidas = [n for n in prueba[1:] if n in presentes][:8]
          for i, n in enumerate(elegidas, 1):
              shutil.copy(os.path.join(imgs, n), f'{destino}/polipo_{i}.jpg')
              man['imagenes'].append({'archivo': f'polipo_{i}.jpg', 'origen': f'segmented-images/images/{n}', 'particion_modelo': 'prueba'})
          json.dump(man, open(f'{destino}/manifiesto.json', 'w'), ensure_ascii=False, indent=2)
          print(len(elegidas), 'pólipos')
          PY
      - name: Subir las candidatas a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/demo/candidatas
          git commit -m "Pólipos de la partición de prueba para las etapas de los casos (flujo imagenes-casos)"
          git push
